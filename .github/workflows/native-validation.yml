name: Native Windows librsvg validation (fork only)
on:
  workflow_dispatch:
    inputs:
      group:
        type: choice
        options: [graphics, buildtools, librsvg]
        default: librsvg
        required: true
      parent_artifacts:
        description: Comma-separated artifact IDs from successful prerequisite runs
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: github.repository == 'ClayWarren/librsvg-feedstock'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.group == 'librsvg' && '[{"subdir":"win-arm64","runner":"windows-11-arm"},{"subdir":"win-64","runner":"windows-2022"}]' || '[{"subdir":"win-arm64","runner":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare native runner and retained prerequisites
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/prepare.ps1 ${{ matrix.subdir }}
      - name: Download and verify built prerequisites
        if: inputs.group == 'librsvg' && matrix.subdir == 'win-arm64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_ARTIFACTS: ${{ inputs.parent_artifacts }}
        run: ./ci/download-parents.ps1
      - name: Build recipes and execute their package tests
        shell: cmd
        run: ci\run.cmd ${{ inputs.group }} ${{ matrix.subdir }}
      - name: Stage artifacts
        if: always()
        shell: pwsh
        run: ./ci/stage.ps1 ${{ matrix.subdir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ inputs.group }}-${{ matrix.subdir }}
          path: native-results/*
          retention-days: 14
